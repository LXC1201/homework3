<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录注册系统</title>
    <style>
        body { 
            font-family: Arial, "Microsoft YaHei", sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover {
            background: #5a67d8;
        }
        .switch-btn {
            background: transparent;
            color: #667eea;
            border: 1px solid #667eea;
        }
        .switch-btn:hover {
            background: #667eea;
            color: white;
        }
        #message {
            text-align: center;
            margin-top: 10px;
            color: #e53e3e;
            font-size: 14px;
        }
        .success {
            color: #38a169 !important;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2 id="title">登录</h2>
    <input type="text" id="username" placeholder="用户名" autocomplete="off">
    <input type="password" id="password" placeholder="密码">
    <button onclick="handleSubmit()" id="submitBtn">登录</button>
    <button onclick="toggleMode()" class="switch-btn" id="switchBtn">切换到注册</button>
    <div id="message"></div>
</div>

<script>
    let isLogin = true;
    
    function toggleMode() {
        isLogin = !isLogin;
        document.getElementById('title').textContent = isLogin ? '登录' : '注册';
        document.getElementById('submitBtn').textContent = isLogin ? '登录' : '注册';
        document.getElementById('switchBtn').textContent = isLogin ? '切换到注册' : '切换到登录';
        document.getElementById('message').textContent = '';
        document.getElementById('message').className = '';
    }

    async function handleSubmit() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        
        // 验证输入
        if (!username || !password) {
            showMessage('用户名和密码不能为空', false);
            return;
        }
        
        if (username.length < 3) {
            showMessage('用户名至少3个字符', false);
            return;
        }
        
        if (password.length < 3) {
            showMessage('密码至少3个字符', false);
            return;
        }
        
        const url = isLogin ? 'login.php' : 'register.php';
        const formData = new FormData();
        formData.append('username', username);
        formData.append('password', password);
        
        try {
            const response = await fetch(url, { 
                method: 'POST', 
                body: formData 
            });
            const data = await response.json();
            
            console.log('服务器返回:', data);
            
            if (data.success) {
                if (isLogin) {
                    // 登录成功，跳转到学生信息页面
                    showMessage('登录成功，正在跳转...', true);
                    setTimeout(() => {
                        window.location.href = 'show_students.php';
                    }, 1000);
                } else {
                    // 注册成功
                    showMessage('注册成功！请登录', true);
                    toggleMode();
                    document.getElementById('username').value = '';
                    document.getElementById('password').value = '';
                }
            } else {
                showMessage(data.message, false);
            }
        } catch (error) {
            showMessage('网络错误，请重试', false);
            console.error('错误:', error);
        }
    }
    
    function showMessage(msg, isSuccess) {
        const msgDiv = document.getElementById('message');
        msgDiv.textContent = msg;
        msgDiv.className = isSuccess ? 'success' : '';
    }
    
    // 回车键提交
    document.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            handleSubmit();
        }
    });
</script>
</body>
</html>
